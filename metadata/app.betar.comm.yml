# F-Droid build metadata for Betar (docs/DISTRIBUTION.md §2/§3).
#
# Reasoned from the publicly documented fdroiddata YAML schema -- NOT validated against
# F-Droid's own linter or build server (that requires a real merge request against the separate
# fdroiddata repository and F-Droid's own CI, neither possible from this dev session). Treat this
# as a well-reasoned starting point for whoever does that submission, not a verified-working
# recipe -- see docs/REPRODUCIBLE-BUILD.md §4 for the rest of what's still blocking an actual
# submission (no dedicated release signing, cross-machine reproducibility untested). Deferred to
# a later pass -- not this one.

Categories:
  - Internet
  - Security
License: AGPL-3.0-or-later
SourceCode: https://github.com/konkomaji/project-mesh
IssueTracker: https://github.com/konkomaji/project-mesh/issues

AutoName: Betar

RepoType: git
Repo: https://github.com/konkomaji/project-mesh

Builds:
  - versionName: 0.1.0-prealpha
    versionCode: 1
    # Pin to the actual commit the release is cut from before submitting -- left as a marker
    # rather than a real commit SHA since no tagged release exists yet.
    commit: REPLACE_WITH_RELEASE_COMMIT_SHA
    subdir: android
    # Cross-compiling the Rust core is a prerequisite step F-Droid's build server needs to run
    # before Gradle -- see android/app/src/main/jniLibs/README.md for why (the .so is gitignored,
    # regenerated from core/ on every build, never committed as a binary blob).
    init:
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
    prebuild:
      - cd ../core && cargo ndk -o ../android/app/src/main/jniLibs -t arm64-v8a -t armeabi-v7a -t x86_64 build --release -p mesh-core
    ndk: r27c
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-prealpha
CurrentVersionCode: 1
